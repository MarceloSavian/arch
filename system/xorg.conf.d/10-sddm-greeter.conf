# Xorg settings for the SDDM login screen's X server (the only Xorg on this system).
Section "ServerFlags"
    # The lock screen IS the SDDM login screen, with your session kept running
    # (unlocked) on another VT. Disable Ctrl+Alt+F1.. so nobody can switch from
    # the login screen straight into that session. Hyprland side: xkb srvrkeys:none.
    Option "DontVTSwitch" "true"
    # Hybrid-GPU laptops: only use the boot GPU, so the greeter doesn't keep the
    # NVIDIA card awake. Harmless with a single GPU.
    Option "AutoAddGPU" "off"
EndSection
