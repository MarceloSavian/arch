# hypridle: routes lock/unlock/sleep events. The only lock screen is SDDM
# (scripts/lock.sh); there is no hyprlock.
general {
    # `loginctl lock-session` (and before sleep) -> SDDM login screen
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    # SDDM sends logind UnlockSession when you log back into this session
    unlock_cmd = ~/.config/hypr/scripts/unlock.sh
    # lock before suspend, so you wake up on the login screen
    before_sleep_cmd = loginctl lock-session
}
