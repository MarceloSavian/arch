general {
    hide_cursor = false   # needed to click "Switch user"
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/cyberpunk-mr/Backgrounds/wallpaper.png
    blur_passes = 2
    blur_size = 6
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# Login card - same size/colour/border as the SDDM theme's card (380 wide, radius 18).
shape {
    monitor =
    size = 380, 340
    color = rgba(26, 28, 38, 0.78)
    rounding = 18
    border_size = 1
    border_color = rgba(88, 55, 148, 1.0)
    position = 0, 48
    halign = center
    valign = center
    zindex = -1
}

# Top-right clock.
# Position convention with halign=right + valign=top:
#   X negative → inward from right edge (so -120 = 120px in from the right)
#   Y negative → inward from top edge   (so -20  = 20px down from the top)
# Both are resolution-adaptable — they anchor to the actual screen edge.
label {
    monitor =
    text = $TIME
    color = rgba(223, 225, 234, 1.0)
    font_size = 72
    font_family = Monocraft
    position = -120, -20
    halign = right
    valign = top
}

# Date — sits just under the clock. Clock font is ~72, plus a small gap.
label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %-d"
    color = rgba(223, 225, 234, 0.7)
    font_size = 16
    font_family = Monocraft
    position = -120, -110
    halign = right
    valign = top
}

# Avatar: ~/.face per user (install.sh --user links it: main user -> the robot,
# others -> the default face), so it matches what SDDM shows for that user.
image {
    monitor =
    path = ~/.face
    size = 140
    border_size = 2
    border_color = rgba(246, 118, 142, 1.0)
    rounding = -1
    position = 0, 120
    halign = center
    valign = center
}

# Name of whoever is logged in (display name, else username) - same rule as SDDM
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/scripts/lock-name.sh
    color = rgba(223, 225, 234, 1.0)
    font_size = 22
    font_family = Monocraft
    position = 0, 20
    halign = center
    valign = center
}

# Hint
label {
    monitor =
    text = Enter password to unlock
    color = rgba(136, 138, 150, 1.0)
    font_size = 12
    font_family = Monocraft
    position = 0, -10
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 332, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(56, 48, 80, 1.0)
    inner_color = rgba(37, 39, 49, 1.0)
    font_color = rgba(223, 225, 234, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##888a96">Password</span>
    hide_input = false
    rounding = 12
    check_color = rgba(122, 162, 247, 1.0)
    fail_color = rgba(246, 94, 81, 1.0)
    fail_text = <span foreground="##f65e51">Wrong password</span>
    capslock_color = rgba(224, 175, 104, 1.0)
    position = 0, -70
    halign = center
    valign = center
}

# "Switch user" - clickable, under the card. Opens the SDDM login screen on
# another VT; this session stays running and locked.
label {
    monitor =
    text = ⇄  Switch user
    color = rgba(136, 138, 150, 1.0)
    font_size = 12
    font_family = Monocraft
    position = 0, -150
    halign = center
    valign = center
    onclick = ~/.config/hypr/scripts/switch-user.sh
}
